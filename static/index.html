<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>NL2SQL Assistant</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 800px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #222;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            font-size: 16px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            resize: none;
        }

        button {
            margin-top: 15px;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .section {
            margin-top: 25px;
        }

        .answer {
            background: #eef6ff;
            padding: 15px;
            border-radius: 8px;
            font-size: 18px;
        }

        pre {
            background: #1e293b;
            color: white;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
        }

        .loading {
            display: none;
            margin-top: 15px;
            text-align: center;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>NL2SQL Assistant</h1>

    <textarea
        id="question"
        placeholder="Ask a question about your data...">
    </textarea>

    <button onclick="askQuestion()">
        Ask Question
    </button>

    <div class="loading" id="loading">
        Processing your question...
    </div>

    <div class="section">

        <h2>Answer</h2>

        <div
            class="answer"
            id="answer">
            Your answer will appear here.
        </div>

    </div>

    <div class="section">

        <h2>Generated SQL</h2>

        <pre id="sql">
        </pre>

    </div>

    <div class="section">

        <h2>Database Result</h2>

        <pre id="result">
        </pre>

    </div>

</div>

<script>

async function askQuestion() {

    const question =
        document.getElementById("question").value;

    if (!question.trim()) {

        alert("Please enter a question.");

        return;
    }

    document.getElementById("loading")
        .style.display = "block";

    try {

        const response =
            await fetch("/ask", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    question: question
                })

            });

        const data = await response.json();

        document.getElementById("answer")
            .innerText = data.answer;

        document.getElementById("sql")
            .innerText = data.sql;

        document.getElementById("result")
            .innerText =
            JSON.stringify(
                data.rows,
                null,
                2
            );

    }

    catch (error) {

        document.getElementById("answer")
            .innerText =
            "Error: " + error.message;

    }

    finally {

        document.getElementById("loading")
            .style.display = "none";

    }

}

</script>

</body>

</html>
